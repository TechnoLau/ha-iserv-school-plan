name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r iserv_school_plan/requirements.txt pytest
      - name: Tests ausfuehren
        run: python -m pytest -q
      - name: Syntax pruefen
        run: python -m compileall -q iserv_school_plan/app iserv_school_plan/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build --tag iserv-school-plan:ci iserv_school_plan
      - name: Importe im Image pruefen
        run: |
          docker run --rm iserv-school-plan:ci python -c "import app.config, app.iserv, app.parsers, app.plan, app.mqtt, app.main; print('imports ok')"
