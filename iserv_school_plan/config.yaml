name: IServ Stundenplan
version: "1.1.1"
slug: iserv_school_plan
description: >-
  Liest den IServ-Stundenplan automatisch ein und stellt Status, erste
  Unterrichtsstunde, naechsten Schultag und "Wecker morgen" als MQTT-Entities
  in Home Assistant bereit. Ferien und Feiertage werden automatisch geladen.
url: https://github.com/TechnoLau/ha-iserv-school-plan
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
services:
  - mqtt:want
options:
  iserv_url: https://schule.example.org
  username: ""
  password: ""
  bundesland: Schleswig-Holstein
  period_times: "1=07:45-08:30;2=08:35-09:20;3=09:50-10:35;4=10:40-11:25;5=11:30-12:15;6=12:20-13:05"
  refresh_minutes: 30
  debug_dump: false
schema:
  iserv_url: url
  username: str?
  password: password?
  bundesland: list(Baden-Württemberg|Bayern|Berlin|Brandenburg|Bremen|Hamburg|Hessen|Mecklenburg-Vorpommern|Niedersachsen|Nordrhein-Westfalen|Rheinland-Pfalz|Saarland|Sachsen|Sachsen-Anhalt|Schleswig-Holstein|Thüringen)
  period_times: str?
  refresh_minutes: int(5,720)
  debug_dump: bool
